title: "HLD Interview Prep"
slug: "hld-interview-prep"
order: 2
level: intermediate
purpose: "The classic product design questions, from small warm-ups to the large systems that come up in senior loops, ending with a revision checklist."
assumes: "You have read the Fundamentals path, or know load balancers, caches, queues and consistent hashing."
outcome: "You can run a design interview from requirements to a defended design, and you know the mistakes that are easy to make."
articles:
  - id: bitly-pastebin
    title: "Design Bit.ly and Pastebin"
    topic: "HLD"
    date: 2026-04-16
    level: beginner
    source: "https://www.vidya-bodha.com/articles/design-bit-ly-and-pastebin"
    why: "A small, complete design is the best warm-up."
    summary: "Designing a URL shortener and a paste-sharing service."
    points:
      - "Generate short unique keys, for example a counter in base62 or a hash, and handle collisions."
      - "Reads vastly outnumber writes, so cache hot links and set a retention policy."
      - "Redirect status codes and click analytics are the usual follow-up questions."
    terms: [cache]
    needs: [unique-id-generator]
  - id: autocomplete
    title: "Design Autocomplete For Search Engines"
    topic: "HLD"
    date: 2026-04-19
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2045906641967833171"
    why: "It introduces low-latency reads over precomputed data."
    summary: "Designing typeahead suggestions that return in a few milliseconds."
    points:
      - "A trie, or a precomputed store of top suggestions, maps each prefix to its best results."
      - "Rankings are rebuilt offline from query logs, not computed on each keystroke."
      - "Cache hot prefixes, and stop the client sending a request on every key press."
    terms: [latency, cache]
    needs: [distributed-cache]
  - id: news-feed
    title: "Design A News-Feed System"
    topic: "HLD"
    date: 2026-05-24
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2058553384735842654"
    why: "Fan-out on write versus fan-out on read first appears here and comes back in later designs."
    summary: "Designing a feed that shows each user the latest posts from the people they follow."
    points:
      - "Fan-out on write precomputes feeds. Fan-out on read builds them when the user opens the app."
      - "Accounts with millions of followers need a hybrid approach because their fan-out is huge."
      - "Cache ready-made feeds, and rank in a separate step."
    terms: [fan-out, cache]
    needs: [distributed-message-queue]
