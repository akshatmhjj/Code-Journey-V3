checks:
  - q: "What is the difference between fan-out on write and fan-out on read?"
    a: "On write, a post is copied into each follower's feed when it is made, so reads are fast and writes are heavy. On read, the feed is built when the user opens it, so writes are cheap and reads are heavy. Real systems often mix both."
  - q: "How do you avoid double booking in a reservation system?"
    a: "Use a transaction or a conditional write that checks the slot is still free as it reserves it, and make the booking request idempotent so a retry does not create a second booking."
  - q: "Why do geohashes help with nearby searches?"
    a: "They turn a location into a short string where nearby places share a prefix, so you can look at one cell and its neighbours instead of scanning every place."
  - q: "What should you do first in a design interview?"
    a: "Clarify the requirements and estimate the scale. The numbers justify each component you choose later."
