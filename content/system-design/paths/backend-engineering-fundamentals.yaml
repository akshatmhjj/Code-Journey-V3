    topic: "Backend Engineering"
    date: 2026-07-05
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2073772366094602241"
    why: "Most backends are only as good as their database use."
    summary: "The first part of a deep look at how databases work inside."
    points:
      - "Storage engines lay data out in pages on disk, and the layout decides what is fast."
      - "Indexes such as B-trees trade write cost for read speed."
