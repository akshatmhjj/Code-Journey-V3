# How the job-post gap analyser recognises skills.
#
# Each skill is matched by its catalog title, by anything in brackets in that title
# ("BI Tools (Power BI, Tableau, Looker)" → power bi, tableau, looker), and by the aliases below.
# Matching ignores case and needs whole words ("sql" won't match inside "mysql").
#
# A leading "=" makes an alias case-sensitive. Use it for words that are also everyday English:
# "=React" matches "React" but not "react quickly to incidents".
# `auto: false` turns off matching on the title itself (needed when the title is such a word).

