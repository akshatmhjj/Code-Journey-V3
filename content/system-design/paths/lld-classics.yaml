title: "LLD Classics"
slug: "lld-classics"
order: 3
level: beginner
purpose: "Object-oriented design ideas first, then the machine coding problems interviewers like to set."
assumes: "You know classes, objects and interfaces in at least one language."
outcome: "You can take a small problem, list its entities, draw the classes and relationships, and explain the patterns you chose."
