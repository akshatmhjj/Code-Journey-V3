  - id: proximity-service
    title: "System Design Of A Proximity Service"
    topic: "Engineering Articles"
    date: 2026-08-22
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2091192716059459825"
    why: "It teaches location search, which Tinder, Airbnb and Maps all need."
    summary: "Designing a service that finds nearby places or people."
    points:
      - "Geohashes or quadtrees split the map so a search only looks at nearby cells."
      - "Check the target cell and its neighbours so results near a cell edge are not missed."
      - "Locations are read far more often than they change."
