        gtag('js', new Date());
        gtag('config', 'G-ZFFH1ZLHTY');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZFFH1ZLHTY';
