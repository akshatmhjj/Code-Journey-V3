    needs: [rest-api-design]
  - id: databases-part-2
    title: "Databases in Depth Part-2"
    topic: "Backend Engineering"
    date: 2026-07-11
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2075942037732667812"
    why: "Next, what makes a group of changes safe."
    summary: "Part two of the database deep dive."
    points:
      - "Transactions group changes so they succeed or fail together."
      - "ACID describes what a reliable transaction promises."
      - "Isolation levels trade safety against speed."
    terms: [acid, index]
    needs: [databases-part-1]
  - id: databases-part-3
    title: "Databases in Depth Part-3"
    topic: "Backend Engineering"
    date: 2026-07-13
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2076649413435687097"
    why: "Finally, what to do when one database is not enough."
    summary: "Part three of the database deep dive."
    points:
      - "Replication copies data to other machines for safety and for read scale."
      - "Sharding splits data across machines when one machine is not enough."
      - "Each choice brings consistency and operating costs."
    terms: [replication, sharding]
    needs: [databases-part-2]
  - id: caching-queues-observability
    title: "Caching, Task Queues, Error Handling, Logging, Monitoring"
    topic: "Backend Engineering"
    date: 2026-07-15
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2077400118647750968"
    why: "These are the tools that keep a backend fast and visible."
    summary: "Caching, background task queues, error handling, logging and monitoring."
    points:
      - "Cache what is read often and changes rarely, and decide how it is invalidated."
      - "Task queues move slow work out of the request path."
      - "Logs, metrics and alerts show you what the system is doing."
