  - id: lld-youtube
    title: "Design Youtube"
    topic: "LLD"
    date: 2026-05-28
    level: intermediate
    source: "https://www.vidya-bodha.com/articles/lld-design-youtube"
    why: "It brings the earlier ideas together in a larger model."
