- term: API
  slug: api
  category: Web
  definition: Application Programming Interface. A way for two pieces of software to talk to each other. When your weather app shows the current temperature, it's calling a weather API to get that data. You send a request to a URL, you get back structured data (usually JSON).
- term: Array
  slug: array
  category: Programming basics
  definition: "An ordered collection of values stored in a single variable. In JavaScript: [1, 2, 3]. In Python: [1, 2, 3]. Arrays are zero-indexed - the first element is at index 0."
- term: Async / Await
  slug: async-await
  category: Programming basics
  definition: A way to write code that waits for slow operations (like fetching data from a server) without freezing the entire program. async marks a function as asynchronous. await pauses inside that function until a Promise resolves. The page stays responsive while waiting.
- term: Boolean
  slug: boolean
  category: Programming basics
  definition: A value that is either true or false. Named after mathematician George Boole. Used in if statements, filters, and toggles. In JavaScript, values like 0, '', null, undefined, and NaN are 'falsy' - they behave like false in conditionals.
- term: Callback
  slug: callback
  category: Programming basics
  definition: A function you pass as an argument to another function, to be called later. 'Call me back when you're done.' button.addEventListener('click', callback). Before async/await, callbacks were how all async code was written, leading to 'callback hell'.
- term: Closure
  slug: closure
  category: JavaScript
  definition: "A function that 'closes over' the variables in its surrounding scope - it remembers them even after the outer function has finished running. Example: a counter function that returns increment/decrement functions which share the same private count variable."
- term: Component
  slug: component
  category: React
  definition: "A reusable, self-contained piece of UI. In React, a component is a function that takes props and returns JSX. In Flutter, everything is a widget - a type of component. Think of components like LEGO bricks: you build small reusable pieces and assemble them into screens."
- term: CSS
  slug: css
  category: Web
  definition: Cascading Style Sheets. The language that styles HTML - colours, fonts, spacing, layout, animations. 'Cascading' means later rules override earlier ones. Flexbox and Grid are CSS's two main layout systems.
- term: Compile
  slug: compile
  category: Programming basics
  definition: Converting source code you write (TypeScript, Kotlin, Swift) into something a machine or runtime can execute. TypeScript compiles to JavaScript. Kotlin compiles to JVM bytecode or native code. Interpreted languages like Python don't need a compile step - they run line by line.
- term: DOM
  slug: dom
  category: Web
  definition: Document Object Model. The browser's tree-shaped representation of your HTML. When JavaScript does document.querySelector('#btn'), it's navigating this tree. React and Flutter build their own virtual versions of this tree to update only what changed.
- term: Dependency
  slug: dependency
  category: Programming basics
  definition: External code your project relies on. Installed with npm (JavaScript), pip (Python), or pub (Dart). A package.json or pubspec.yaml lists all your dependencies. node_modules or .dart_tool contains the installed code.
- term: Event
  slug: event
  category: Web
  definition: Something that happens in the browser - a click, scroll, key press, form submit. You listen for events with addEventListener. Events bubble up the DOM tree unless you call event.stopPropagation().
- term: Fetch API
  slug: fetch-api
  category: Web
  definition: A browser built-in for making HTTP requests. fetch('/api/data') returns a Promise. You await it, then call .json() to parse the response body. Always wrap in try/catch to handle network errors.
- term: Function
  slug: function
  category: Programming basics
  definition: A reusable block of code that takes inputs (parameters) and produces an output (return value). Functions are the core unit of reuse in programming. In JavaScript, functions are 'first-class' - you can pass them as arguments, return them from other functions, and store them in variables.
- term: Git
  slug: git
  category: Tools
  definition: A version control system that tracks changes to your code over time. git add, git commit, git push, git pull. GitHub stores your git repos in the cloud. Branching lets multiple people work on the same project without overwriting each other's changes.
- term: Hook
  slug: hook
  category: React
  definition: "A React function that lets you use state and lifecycle features inside function components. useState, useEffect, useRef, useCallback, useMemo are built-in hooks. The rules: only call hooks at the top level of your component, never inside loops or conditions."
- term: HTML
  slug: html
  category: Web
  definition: HyperText Markup Language. The structure of every webpage - headings, paragraphs, links, images, forms. Not a programming language - it's a markup language. You describe what elements are (<h1> means 'main heading') but not what they do or look like.
- term: HTTP
  slug: http
  category: Web
  definition: HyperText Transfer Protocol. The language of the web. Every time you open a page or call an API, your browser sends an HTTP request (GET, POST, PUT, DELETE) and the server sends back a response with a status code (200 = OK, 404 = Not Found, 500 = Server Error).
- term: Interface
  slug: interface
  category: TypeScript
  definition: "In TypeScript, a named type that describes the shape of an object. interface User { id: number; name: string }. In object-oriented languages, an interface defines what methods a class must implement, without specifying how."
- term: JSON
  slug: json
  category: Programming basics
  definition: 'JavaScript Object Notation. A text format for storing and transferring structured data. { "name": "Alex", "age": 30 }. APIs return JSON. JSON.parse() converts a JSON string to a JavaScript object. JSON.stringify() converts back.'
- term: Library
  slug: library
  category: Programming basics
  definition: Pre-written code you can import and use. React is a library (just the UI layer). Libraries are more focused than frameworks. You call library code. The framework calls your code (inversion of control).
- term: Middleware
  slug: middleware
  category: Web
  definition: "Functions that run between an HTTP request arriving and your route handler responding. Used for: authentication, logging, parsing request bodies, rate limiting. In Express: app.use(middleware). Order matters."
- term: Module
  slug: module
  category: Programming basics
  definition: A file (or group of files) that exports functions, classes, or values for other files to use. import { greet } from './utils.js' in JavaScript. from utils import greet in Python. Modules are how you split large codebases into maintainable pieces.
- term: Null / Undefined
  slug: null-undefined
  category: Programming basics
  definition: Two ways to represent 'nothing'. null is intentional absence - you explicitly set it. undefined is accidental absence - a variable declared but not assigned. TypeScript's null safety forces you to handle both before using a value.
- term: Object
  slug: object
  category: Programming basics
  definition: "A collection of key-value pairs. { name: 'Alex', age: 30 }. Objects can contain any type of value including other objects and arrays. In JavaScript, almost everything is an object - arrays, functions, dates."
- term: Promise
  slug: promise
  category: JavaScript
  definition: An object representing a future value that may not exist yet. Pending → Fulfilled (with a value) or Rejected (with an error). fetch() returns a Promise. You resolve it with .then().catch() or async/await.
- term: Props
  slug: props
  category: React
  definition: Short for properties - data you pass into a React component from its parent. <UserCard name='Alex' role='admin' />. The component receives props as a function argument and uses them to render. Props are read-only - a child never modifies them.
- term: Recursion
  slug: recursion
  category: Programming basics
  definition: "A function that calls itself. Used when a problem can be broken into smaller versions of itself - flattening nested arrays, traversing a tree, calculating fibonacci. Always needs a base case to stop. Without it: infinite recursion → stack overflow."
- term: REST API
  slug: rest-api
  category: Web
  definition: "Representational State Transfer - an architectural style for APIs. Use HTTP verbs: GET to read, POST to create, PUT/PATCH to update, DELETE to remove. Responses are usually JSON. Stateless - each request is independent."
- term: State
  slug: state
  category: React
  definition: "Data that belongs to a component and causes it to re-render when changed. In React: const [count, setCount] = useState(0). You never mutate state directly - you call the setter function and React re-renders. State flows down; events flow up."
- term: Scope
  slug: scope
  category: Programming basics
  definition: "Where a variable is accessible. Block scope: inside {} curly braces (let, const). Function scope: inside the function (var). Global scope: everywhere. Closures let inner functions access outer scope variables even after the outer function returns."
- term: Type
  slug: type
  category: TypeScript
  definition: A label that tells the compiler what kind of value a variable holds - string, number, boolean, or complex types like User[]. TypeScript's type system catches bugs at compile time by enforcing that you use values correctly.
- term: useState
  slug: usestate
  category: React
  definition: A React hook for adding state to a function component. const [value, setValue] = useState(initialValue). When setValue is called, React re-renders the component with the new value. The initial value is only used on the first render.
- term: useEffect
  slug: useeffect
  category: React
  definition: A React hook for running side effects (fetch data, set up subscriptions, update the document title) after render. The dependency array [] controls when it re-runs. An empty [] runs once on mount. A cleanup function prevents memory leaks.
- term: Virtual DOM
  slug: virtual-dom
  category: React
  definition: React's in-memory representation of the actual DOM. When state changes, React rebuilds the virtual DOM, diffs it against the previous version, and updates only the changed parts in the real DOM. Much faster than updating the whole page.
- term: Widget
  slug: widget
  category: Mobile
  definition: "Flutter's fundamental building block - equivalent to a React component. Everything in Flutter is a widget: layout (Column, Row), styling (Padding, Container), interaction (GestureDetector), and even the whole screen (Scaffold). Widgets are composable and immutable."
- term: npm
  slug: npm
  category: Tools
  definition: Node Package Manager. The tool for installing JavaScript libraries. npm install react installs React and adds it to package.json. node_modules contains all installed packages. Never commit node_modules to git - use npm install to regenerate it.
- term: pip
  slug: pip
  category: Tools
  definition: Python's package installer. pip install pandas installs Pandas. requirements.txt lists all dependencies. Always use a virtual environment (python -m venv venv) so packages don't conflict between projects.
- term: REST
  slug: rest
  category: Web
  definition: See REST API.
- term: SQL
  slug: sql
  category: Data
  definition: Structured Query Language. The language for talking to relational databases. SELECT * FROM users WHERE active = true. Has been the standard since the 1970s and is used in every company that has data (every company).
- term: Null Safety
  slug: null-safety
  category: Mobile
  definition: A language feature (Dart, TypeScript, Kotlin, Swift) that makes the compiler enforce that you handle the case where a value might be absent. String? name means it might be null. String name means it is guaranteed non-null. Eliminates entire category of null-reference crashes.
- term: Framework
  slug: framework
  category: Programming basics
  definition: A bigger structure than a library - it provides the skeleton of your app and calls your code at the right times. Flutter is a framework (it controls the rendering loop). Express is a minimal framework. The framework dictates the architecture.
- term: Coroutine
  slug: coroutine
  category: Mobile
  definition: Kotlin's lightweight concurrency primitive. Like a thread but much cheaper. viewModelScope.launch { } starts a coroutine. suspend fun makes a function pauseable without blocking a thread. Conceptually similar to JavaScript's async/await.
- term: ORM
  slug: orm
  category: Web
  definition: "Object-Relational Mapper. Translates between your programming language's objects and database rows. Prisma (JS/TS), SQLAlchemy (Python), Room (Android). Instead of writing SQL, you write: prisma.user.findMany({ where: { active: true } })."
- term: JWT
  slug: jwt
  category: Web
  definition: JSON Web Token. A signed string that proves who you are. Created on login, sent with every future request in the Authorization header. The server verifies the signature - no database lookup needed. Has an expiry time. Never put sensitive data in it.
- term: CI/CD
  slug: ci-cd
  category: Tools
  definition: "Continuous Integration / Continuous Deployment. Automatically run tests and deploy your app whenever you push code. GitHub Actions is the most common tool. Every push triggers: lint → test → build → deploy. Removes the 'it works on my machine' problem."
