checks:
  - q: "What does the event loop do in JavaScript?"
    a: "It lets one thread handle asynchronous work. While waiting on I/O the thread runs other tasks, and callbacks are queued and run when the call stack is empty."
  - q: "What is the GIL in Python?"
    a: "A lock in the standard CPython interpreter that lets only one thread run Python bytecode at a time, which limits CPU-bound work in threads."
