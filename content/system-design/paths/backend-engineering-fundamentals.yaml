  - id: security-scaling-concurrency
    title: "Security, Scaling & Performance, Concurrency & Parallelism"
    topic: "Backend Engineering"
    date: 2026-07-16
    level: intermediate
    source: "https://x.com/Harry_The_Nerd/status/2077722979882963122"
    why: "It closes the path with the concerns that grow as a system does."
    summary: "Security, scaling, performance, and concurrency and parallelism."
    points:
      - "Defend against injection, broken auth and leaked secrets, and apply least privilege."
      - "Scale up first, scale out when you must, and find the bottleneck before changing anything."
      - "Concurrency is handling many things at once. Parallelism is doing many things at once."
    terms: [scalability, throughput]
