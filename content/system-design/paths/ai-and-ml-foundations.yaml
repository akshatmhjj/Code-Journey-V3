checks:
  - q: "What is the difference between training and inference?"
    a: "Training builds a model by learning from data. Inference uses the finished model to make predictions on new inputs."
  - q: "Why split data into train and test sets?"
    a: "The test set is data the model has never seen, so its score shows how well the model works on new inputs, not just on the examples it learned from."
  - q: "What are the usual stages of a recommendation system?"
    a: "Candidate generation narrows millions of items to a few hundred, ranking scores them, and re-ranking adjusts the final list for variety and rules."
