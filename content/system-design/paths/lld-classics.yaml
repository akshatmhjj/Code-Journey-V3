    topic: "LLD"
    date: 2026-05-16
    level: beginner
    source: "https://www.vidya-bodha.com/articles/lld-concepts"
    why: "It gives you the vocabulary the other four problems use."
    summary: "Core low-level design ideas: classes, relationships and the principles behind a structure that is easy to change."
    points:
