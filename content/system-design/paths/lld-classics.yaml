checks:
  - q: "What is the state pattern, and where would you use it?"
    a: "It moves each state's behaviour into its own class, so an object changes how it acts as its state changes. A vending machine is the standard example."
  - q: "Why prefer composition to inheritance?"
    a: "Composition lets you swap parts at run time and avoids deep class trees that break whenever a parent changes."
  - q: "What are the first steps in an LLD interview?"
    a: "Clarify the requirements, list the entities and how they relate, then sketch the classes and interfaces before writing any methods."
