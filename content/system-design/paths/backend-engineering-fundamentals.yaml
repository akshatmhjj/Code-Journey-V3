checks:
  - q: "What is the difference between authentication and authorization?"
    a: "Authentication proves who the caller is. Authorization decides what that caller may do once you know who they are."
  - q: "Why do queries use indexes, and what do they cost?"
    a: "An index lets the database find rows without reading the whole table, which speeds up reads. It costs extra storage and slows writes, because the index must be updated too."
  - q: "What belongs in middleware, and what belongs in a controller?"
    a: "Middleware holds steps that apply to many routes, such as logging, auth and rate limits. A controller handles one route and passes the real work to a service."
  - q: "Why move slow work to a task queue?"
    a: "The request can return quickly, and the slow job runs in the background with retries, instead of making the user wait."
