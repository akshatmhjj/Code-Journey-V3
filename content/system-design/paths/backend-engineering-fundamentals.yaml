title: "Backend Engineering Fundamentals"
slug: "backend-engineering-fundamentals"
order: 4
level: beginner
purpose: "How a production backend works, from the first HTTP request through databases, caching and security."
assumes: "You can write a simple server in any language."
outcome: "You can follow a request through a backend and say where each concern belongs, from validation to caching to security."
articles:
  - id: http-routing
