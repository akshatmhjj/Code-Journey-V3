    topic: "Backend Engineering"
    date: 2026-05-10
    level: beginner
    source: "https://x.com/Harry_The_Nerd/status/2053366145995178087"
    why: "Every backend starts with a request."
    summary: "How HTTP requests work and how a server routes them to code."
    points:
      - "A request has a method, a path, headers and sometimes a body. A response has a status code."
      - "Routing maps a method and path to a handler."
      - "Know the common status codes and which methods are idempotent."
    terms: [api, idempotency]
    needs: []
  - id: serialization-auth
    title: "Serialization, Deserialization, Authentication and Authorization"
    topic: "Backend Engineering"
    date: 2026-05-10
    level: beginner
    source: "https://x.com/Harry_The_Nerd/status/2053487726033559704"
    why: "Once requests arrive, you must read the data and know who sent it."
    summary: "How data is turned into bytes for the wire, and how a server knows who is calling and what they may do."
    points:
      - "Serialization turns objects into formats such as JSON. Deserialization reverses it."
      - "Authentication proves who you are. Authorization decides what you may do."
      - "Sessions and tokens are two ways to remember a signed-in user."
