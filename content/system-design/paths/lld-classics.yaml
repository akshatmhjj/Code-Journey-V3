    title: "Design a Parking Lot"
    topic: "LLD"
    date: 2026-05-22
    level: beginner
    source: "https://www.vidya-bodha.com/articles/design-a-parking-lot"
    why: "It is the standard first machine coding problem."
    summary: "Designing a parking lot: vehicles, spots, tickets and fees."
    points:
      - "Start with the entities: vehicle, spot, ticket and lot."
