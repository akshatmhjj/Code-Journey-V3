- date: 2026-10-09
  version: "2.0.0-beta.11"
  title: Share your path
  changes:
    - type: added
      text: Pick a handle on My Path and turn on a public page at codejourney.space/u/your-handle — your destination, progress and ticked skills, stage by stage. Handy for a CV, LinkedIn or GitHub.
    - type: added
      text: It's off until you switch it on, shows only the name you choose (never your email), and is kept out of search engines.
- date: 2026-10-08
  version: "2.0.0-beta.10"
  title: Save, rate and suggest resources
  changes:
    - type: added
      text: Bookmark any resource to come back to. Your saved resources are listed on My Path, and the library has a Saved filter.
    - type: added
      text: Mark resources as helpful. The helpful count is public; a thumbs-down tells us a link is outdated or broken and is only seen by the Code Journey team.
    - type: added
      text: Know a better resource? Suggest one from any skill page. Every suggestion is checked by a person, and you can follow its status on My Path.
    - type: changed
      text: The gap checker's note on its limits now appears before you paste a post.
- date: 2026-10-08
  version: "2.0.0-beta.9"
  title: Job post gap checker
  changes:
    - type: added
      text: Paste any tech job post to see the skills it asks for, which you already have, and what to learn next — in prerequisite order, with the best resource for each and an estimate of the time it'll take.
    - type: added
      text: It also flags foundations the post assumes but doesn't mention, like JavaScript behind a React job, and lists tech it names that Code Journey doesn't cover yet.
    - type: added
      text: It runs entirely in your browser — the job post is never uploaded. Signed in, your answers save straight to My Path.
- date: 2026-10-08
  version: "2.0.0-beta.8"
  title: Compass and Compare
  changes:
    - type: added
      text: Compass — eight quick questions that suggest three roles that suit you, with the reasons from your own answers. No account needed.
    - type: added
      text: Compare any two roles side by side — skills in common, overlap, time to job-ready, must-have skills, interviews and how AI is changing each. Comparisons can be shared as links.
    - type: changed
      text: The "New to tech" path on the home page now starts with Compass, and every role page links to comparisons with its related roles.
- date: 2026-10-07
  version: "2.0.0-beta.7"
  title: My Path is live
  changes:
    - type: added
      text: Pick a destination role and tick off each skill on its route as "learning" or "done". Stations you've finished fill in on the route itself.
    - type: added
      text: Your profile now shows how far along you are — percentage complete, progress per stage, which stage you're on, your next stations, and the hours and months left at ten hours a week.
    - type: added
      text: Every role page now has a "Make this my route" button and a progress summary in its sidebar.
    - type: added
      text: Your profile also shows your CJ AI questions used today, your account details, and how to get your data exported or deleted.
- date: 2026-10-07
  version: "2.0.0-beta.6"
  title: Tangerine by default, and themes that follow you
  changes:
    - type: changed
      text: Tangerine is now the theme new visitors see first.
    - type: added
      text: Signed-in visitors can save their palette and light/dark choice to their account, so it loads automatically on any device.
- date: 2026-10-07
  version: "2.0.0-beta.5"
  title: CJ AI answers from Code Journey
  changes:
    - type: changed
      text: CJ AI now answers only from Code Journey's own pages. Every answer cites the pages it used, lists them underneath, and links straight to them.
    - type: added
      text: Answers stream as they're written, with a stop button and thumbs up/down on each one.
    - type: added
      text: When a question isn't covered, CJ AI says so and points to the closest pages instead of guessing.
    - type: added
      text: A daily limit of 40 questions per account, so the assistant stays free to run.
- date: 2026-10-06
  version: "2.0.0-beta.4"
  title: The whole map, written
  changes:
    - type: added
      text: The last nine routes — Design Engineer, Analytics Engineer, MLOps Engineer, Platform Engineer, Cloud Security Engineer, Solutions Engineer, Developer Advocate, Game Developer and Embedded/IoT Engineer. All 26 routes are now complete.
    - type: added
      text: Fifteen new skill pages, including UI design, web animation, Go, internal developer platforms, C#, C++, Unity, C, microcontrollers, RTOS and tech interviewing. All 99 skills on the map now have a page.
- date: 2026-10-06
  version: "2.0.0-beta.3"
  title: Wave 2 routes
  changes:
    - type: added
      text: Full routes for Android Engineer, iOS Engineer, Data Engineer, Cloud Engineer, Site Reliability Engineer, Application Security Engineer and Forward Deployed Engineer — 17 routes now live.
    - type: added
      text: New skill pages for Jetpack Compose, SwiftUI, data warehouses, incident response, the OWASP Top 10, threat modelling, security testing and working with customers.
- date: 2026-10-06
  version: "2.0.0-beta.2"
  title: All ten launch routes
  changes:
    - type: added
      text: Full routes for Backend, Full-Stack, Cross-platform Mobile, Data Analyst, Data Scientist, AI Engineer, ML Engineer, DevOps and QA/SDET — joining Frontend.
    - type: added
      text: 58 new skill pages, from Git and system design to RAG, Kubernetes and Playwright. Every skill on every launch route now has its own page.
    - type: added
      text: A weekly automatic check of every resource link.
- date: 2026-10-06
  version: "2.0.0-beta"
  title: Code Journey 2.0 foundation
  changes:
    - type: added
      text: A new site built around roles, skills and resources, with a network map of every tech career route.
    - type: added
      text: Four colour themes — Harbor, Juniper, Tangerine and Orchard — each with light and dark modes.
    - type: added
      text: Search across roles, skills, resources and the glossary from anywhere with ⌘K or Ctrl+K.
    - type: added
      text: The Frontend Engineer route, the first of ten launch roles.
    - type: changed
      text: Every page is now public. An account is only needed to save progress.
    - type: changed
      text: CJ AI now runs on our server, so no keys are exposed in the browser.
    - type: removed
      text: Notes, tasks and the unfinished in-browser editor. Your saved notes stay in your account data.
